[project]
name = "my-fastapi-app"
version = "0.1.0"
dependencies = []

[environment]
root = ["."] 
python = "./envs/python.exe"
extraPaths = ["."]

[tool.ruff]
src = ["."]
line-length = 88

extend-exclude = ["**/__init__.py"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = [
    "E501", 
    "B008", 
]

[tool.ruff.lint.isort]
combine-as-imports = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.rules]
all = "error"