src = ["."]
line-length = 88

extend-exclude = ["**/__init__.py"]

[lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = [
    "E501", 
    "B008", 
]

[lint.isort]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"