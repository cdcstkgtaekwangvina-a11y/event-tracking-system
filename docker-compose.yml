  # App — FastAPI + Granian + uvloop
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-tracking-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - env=production
